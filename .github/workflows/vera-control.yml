name: vera-control verification

on:
  push:
    branches:
      - main
    paths:
      - "vera-control/**"
      - "resources/profiles/VORMETRA/**"
      - ".github/workflows/vera-control.yml"
  pull_request:
    branches:
      - main
    paths:
      - "vera-control/**"
      - "resources/profiles/VORMETRA/**"
      - ".github/workflows/vera-control.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vera-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.10"
          - "3.13"

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        working-directory: vera-control

    steps:
      # GitHub-owned actions are pinned to the exact commits behind their
      # official releases so the public verification chain is reproducible.
      - name: Check out control layer and VORMETRA profiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            vera-control
            resources/profiles/VORMETRA

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: vera-control/pyproject.toml

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python package
        run: python -m compileall -q vera_control

      - name: Run control, API, profile-safety and STL tests
        run: python -m pytest -q --disable-warnings --maxfail=1
