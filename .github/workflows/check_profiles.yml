name: VORMETRA profile verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "resources/profiles/VORMETRA/**"
      - "resources/profiles/VORMETRA.json"
      - "scripts/assign_vendor_setting_ids.py"
      - "scripts/orca_extra_profile_check.py"
      - ".github/workflows/check_profiles.yml"
  push:
    branches:
      - main
    paths:
      - "resources/profiles/VORMETRA/**"
      - "resources/profiles/VORMETRA.json"
      - "scripts/assign_vendor_setting_ids.py"
      - "scripts/orca_extra_profile_check.py"
      - ".github/workflows/check_profiles.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vormetra-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate VORMETRA profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out profile and validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            resources/profiles/VORMETRA
            resources/profiles/VORMETRA.json
            scripts/assign_vendor_setting_ids.py
            scripts/orca_extra_profile_check.py

      - name: Parse VORMETRA JSON files
        shell: bash
        run: |
          find resources/profiles/VORMETRA -type f -name "*.json" -print0 \
            | xargs -0 -n1 python3 -m json.tool > /dev/null
          python3 -m json.tool resources/profiles/VORMETRA.json > /dev/null

      - name: Verify VORMETRA names, references and deterministic setting IDs
        run: python3 scripts/orca_extra_profile_check.py --vendor VORMETRA
