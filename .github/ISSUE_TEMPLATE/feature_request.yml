name: Feature request
description: Propose a focused improvement to a VORMETRA profile or control interface
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose engine-wide features to OrcaSlicer upstream. This form is for
        VORMETRA profiles, pellet/FGF behaviour, vera-control, and Vera Console.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and documentation for a similar request.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - G1000 profiles
        - Pellet or FGF slicing behaviour
        - vera-control HTTP API or MCP server
        - Vera Console
        - Native VORMETRA Slice application
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the current limitation and its practical effect.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Required machine data or evidence
      description: Cite any numerical machine value; mark unresolved values as TBD.
    validations:
      required: false
