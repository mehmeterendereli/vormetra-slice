name: Bug report
description: Report a VORMETRA profile, control-layer, console, or fork-specific defect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for VORMETRA-specific problems. Report defects that also
        reproduce in an unmodified OrcaSlicer build to the upstream project.
        Do not post credentials, customer data, private models, or vulnerability
        details in a public issue.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing open and closed issues.
          required: true
        - label: I removed credentials, private data, and machine-specific identifiers.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - G1000 machine or process profile
        - Pellet material profile
        - vera-control HTTP API
        - vera-control MCP server
        - Vera Console
        - Native VORMETRA Slice application
        - Unsure
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Use the Git commit hash when no release applies.
      placeholder: e.g. 16f963f
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or minimal sample
      description: Attach only the minimum evidence needed after removing private data.
    validations:
      required: false
